name: Publish Package

on:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check release version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          npm_version="$(node -p 'require("./package.json").version')"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$TAG" != "v$npm_version" ] || [ "$TAG" != "v$cargo_version" ]; then
            echo "::error::Release $TAG doesn't match package.json ($npm_version) and Cargo.toml ($cargo_version)"
            exit 1
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust handler
        run: cargo test --locked

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Authenticates through npm trusted publishing (OIDC, no npm token), which this workflow
      # file and the `npm` environment must be registered for, and needs npm 11.5.1 or later
      # (Node.js 24 ships it). Runs `pnpm check` (prepublishOnly) and `pnpm build` (prepack) first.
      - name: Publish to npm
        run: npm publish

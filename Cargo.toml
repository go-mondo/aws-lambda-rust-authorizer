[package]
name = "mondo-lambda-authorizer"
version = "0.2.0"
edition = "2024"
description = "AWS Lambda Rust authorizers for Mondo Identity."
repository = "https://github.com/go-mondo/aws-lambda-rust-authorizer"
readme = "README.md"

[dependencies]
aws_lambda_events = { version = "1.2.1", default-features = false, features = ["apigw"] }
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"], default-features = false }
lambda_runtime = { version = "1.5.0", default-features = false, features = ["tracing"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "json", "registry", "std"] }

[dev-dependencies]
jsonwebtoken = { version = "12.0.0", features = ["use_pem", "rust_crypto"] }
wiremock = "0.6.5"

[[bin]]
name = "mondo-rest-api-authorizer"
path = "src/bin/mondo-rest-api-authorizer.rs"

[profile.release]
codegen-units = 1
lto = true
strip = true
